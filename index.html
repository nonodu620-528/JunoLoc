<head>
    <meta charset="UTF-8">
    <!-- Empêche le zoom et gère l'encoche de l'iPhone (safe-area) -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Déclare l'app comme une Web App iOS (Plein écran) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JunoLoc">

    <title>JunoLoc</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #007aff;
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #1c1c1e;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* Reset et comportement natif iOS */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: calc(env(safe-area-inset-top, 40px) + 16px) 16px var(--safe-bottom) 16px;
            /* Empêche la sélection de texte accidentelle comme sur une vraie app */
            -webkit-user-select: none;
            user-select: none;
            /* Scroll ultra fluide sur iOS */
            -webkit-overflow-scrolling: touch;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .annonce-card {
            background: var(--card);
            border-radius: 20px;
            /* Bords très arrondis style Apple */
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            /* Coupe l'image aux bords de la carte */
        }

        /* Mise en valeur de la photo */
        .image-preview {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #e5e5ea;
            display: block;
        }

        .card-content {
            padding: 16px;
        }

        .annonce-header {
            margin-bottom: 16px;
        }

        .titre {
            font-weight: 700;
            font-size: 20px;
            margin: 0 0 4px 0;
        }

        .prix {
            font-size: 18px;
            color: var(--primary);
            font-weight: 600;
            margin: 0;
        }

        /* Boutons tactiles généreux */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            padding: 14px 16px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-outline {
            background: #e5f0ff;
            color: var(--primary);
        }

        .status-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f2f2f7;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Checkbox style iOS */
        input[type="checkbox"] {
            transform: scale(1.3);
            margin-right: 10px;
            accent-color: var(--primary);
        }
    </style>
</head>
<body>
    <h1>Mes Annonces 🏠</h1>
    <div id="liste-annonces">
        <!-- Les annonces seront injectées ici par JunoLoc.js -->
    </div>
    
    <script src="JunoLoc.js?v=3"></script>
</body>
</html>
